[tools]
bun = "1.3"
node = "22"
gh = "latest"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.build]
description = "Type-check and emit lib/ for every package"
run = "bun run build"

[tasks.test]
description = "Run unit tests"
run = "bun run test"

[tasks.lint]
description = "Lint and check formatting with Biome"
run = "bun run lint"

[tasks.format]
description = "Format and autofix with Biome"
run = "bun run format"

[tasks.clean]
description = "Remove build output"
run = "bun run clean"

[tasks.smoke]
description = "Load the real native node-hid binding through the built library"
depends = ["build"]
run = "bun scripts/smoke.ts"

[tasks.ci]
description = "Run lint, build, tests, and the native smoke check"
depends = ["lint", "build", "test", "smoke"]

[tasks.release]
description = "Bump versions, build, tag, and publish (usage: mise run release <major|minor|patch>)"
run = "bun scripts/release.ts {{arg(name='level')}}"
