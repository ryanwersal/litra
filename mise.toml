[tools]
bun = "1.3"
node = "22"
gh = "latest"

[tasks.install]
description = "Reinstall locked dependencies, including native bindings"
# Restore native bindings even when dependencies were cached without scripts.
run = "bun install --frozen-lockfile --force"

[tasks.build]
description = "Type-check and emit lib/ for every package"
run = "bun run build"

[tasks.test]
description = "Run unit tests"
run = "bun run test"

[tasks.lint]
description = "Lint and check formatting with Biome"
run = "bun run lint"

[tasks.format]
description = "Format and autofix with Biome"
run = "bun run format"

[tasks.clean]
description = "Remove build output"
run = "bun run clean"

[tasks.smoke]
description = "Load the CommonJS package and native HID binding in Bun and Node"
depends = ["build"]
run = "bun scripts/smoke.mjs && node scripts/smoke.mjs"

[tasks.package]
description = "Verify both publishable package archives and the CLI executable"
depends = ["build"]
run = "bun run package"

[tasks.ci]
description = "Run lint, build, tests, package checks, and the native smoke check"
depends = ["lint", "build", "test", "package", "smoke"]

[tasks.release]
description = "Bump versions, build, tag, and publish (usage: mise run release <major|minor|patch>)"
run = "bun scripts/release.ts {{arg(name='level')}}"
